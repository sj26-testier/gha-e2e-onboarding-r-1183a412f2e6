name: Test

on: [push, pull_request, workflow_dispatch]

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [windows-latest]
        include:
          # Add new helper variables to existing jobs
          - {python-version: "3.13", toxenv: "py313"}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Get pip cache dir
        id: pip-cache
        shell: bash
        run: |
          echo "PIP_DIR=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.PIP_DIR }}
          key:
            ${{ matrix.os }}-${{ matrix.python-version }}-v1-${{ hashFiles('**/tox.ini') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.python-version }}-v1-

      - name: Install dependencies
        run: |
          python -m pip install tox

      - name: Tox tests
        run: |
          tox -e ${{ matrix.toxenv }}

      - name: DIAGNOSTIC ONLY - Python installer logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          # Failure-only lab diagnostic. Never change installer settings or inspect general environment.
          $ErrorActionPreference = 'Stop'
          Write-Output '=== Python 3.13 installer diagnostic step executed ==='
          # Native controls are public; retain full installer logs only on the private Buildkite runtime.
          if ($env:RUNNER_TEMP -notmatch '[\\/]buildkite-gha-runner-\d+$') {
              Write-Output 'Full installer diagnostics omitted outside the private Buildkite runtime'
              exit 0
          }
          $roots = @($env:TEMP, $env:RUNNER_TEMP) | Where-Object { $_ } | Select-Object -Unique
          $seen = @{}
          $files = @()
          foreach ($root in $roots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) { continue }
              $candidates = Get-ChildItem -LiteralPath $root -File -Filter '*3.13*.log' -Recurse -Depth 4 -ErrorAction SilentlyContinue |
                  Select-Object -First 64
              foreach ($file in $candidates) {
                  if ($file.Name -notmatch '(?i)python.*3\.13|3\.13.*python') { continue }
                  if (-not $seen.ContainsKey($file.FullName)) {
                      $seen[$file.FullName] = $true
                      $files += $file
                  }
              }
          }
          $selected = @($files | Sort-Object LastWriteTime -Descending | Select-Object -First 8)
          $total = 0
          Write-Output ('Matching Python 3.13 logs: ' + $files.Count + '; selected at most 8')
          foreach ($file in $selected) {
              if ($file.Length -gt 262144 -or ($total + $file.Length) -gt 1048576) {
                  Write-Output ('Skipped oversized installer log: ' + $file.Name + '; bytes=' + $file.Length)
                  continue
              }
              $total += $file.Length
              $text = [IO.File]::ReadAllText($file.FullName)
              $text = $text -replace '(?im)^.*(?:token|password|authorization|secret|cookie).*$', '[REDACTED credential-related line]'
              $text = $text -replace '(https?://[^\s?]+)\?[^\s]+', '$1?[QUERY REDACTED]'
              $text = $text -replace '(?:github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]+)', '[REDACTED token]'
              Write-Output ('Installer log: ' + $file.FullName + '; original bytes=' + $file.Length)
              $lines = $text -split '\r?\n'
              $matchedLines = @()
              for ($index = 0; $index -lt $lines.Length; $index++) {
                  if ($lines[$index] -match '(?i)error|failed|exit code|return code|result:|0x[0-9a-f]{8}') {
                      $matchedLines += $index
                      if ($matchedLines.Count -ge 40) { break }
                  }
              }
              Write-Output '--- Installer error/code excerpts (at most 40 matches, adjacent lines) ---'
              foreach ($index in $matchedLines) {
                  $start = [Math]::Max(0, $index - 1)
                  $end = [Math]::Min($lines.Length - 1, $index + 1)
                  for ($line = $start; $line -le $end; $line++) {
                      Write-Output (($line + 1).ToString() + ': ' + $lines[$line])
                  }
              }
              Write-Output ('BEGIN_SANITIZED_PYTHON_INSTALLER_LOG ' + $file.Name)
              Write-Output $text
              Write-Output ('END_SANITIZED_PYTHON_INSTALLER_LOG ' + $file.Name)
          }
          Write-Output ('=== Python installer diagnostic complete; collected bytes=' + $total + ' ===')
          exit 0
