name: Test

on: [push, pull_request, workflow_dispatch]

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [windows-latest]
        include:
          # Add new helper variables to existing jobs
          - {python-version: "3.13", toxenv: "py313"}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Get pip cache dir
        id: pip-cache
        shell: bash
        run: |
          echo "PIP_DIR=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.PIP_DIR }}
          key:
            ${{ matrix.os }}-${{ matrix.python-version }}-v1-${{ hashFiles('**/tox.ini') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.python-version }}-v1-

      - name: Install dependencies
        run: |
          python -m pip install tox

      - name: Tox tests
        run: |
          tox -e ${{ matrix.toxenv }}

      - name: DIAGNOSTIC ONLY - Python installer logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          # Explicitly authorized diagnostic retry, not setup-python/workflow success.
          $ErrorActionPreference = 'Stop'
          Write-Output '=== DIAGNOSTIC ONLY: repeat CPython installer with explicit logging ==='
          if ($env:RUNNER_TEMP -notmatch '[\\/]buildkite-gha-runner-\d+$') {
              Write-Output 'Installer retry omitted outside the private Buildkite runtime'
              exit 0
          }
          $pythonArchPath = Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.13.15\x64'
          $exeName = 'python-3.13.15-amd64.exe'
          $installer = Join-Path $pythonArchPath $exeName
          $item = Get-Item -LiteralPath $installer -Force
          if ($item -isnot [IO.FileInfo] -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw 'Expected exact regular Python 3.13.15 installer file'
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          # Binary from the exact 3.13.15-31064747964 release asset; rejects another version or altered file.
          if ($hash -ne 'edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403') {
              throw 'Installer hash does not match the inspected Python 3.13.15 release asset'
          }
          Write-Output ('Installer verified: ' + $installer + '; SHA256=' + $hash)
          Write-Output ('Installer ProductVersion=' + $item.VersionInfo.ProductVersion)
          $logPath = Join-Path $env:RUNNER_TEMP 'python-installer-diagnostic.log'
          $execParams = "DefaultAllUsersTargetDir=$pythonArchPath InstallAllUsers=1 "
          # Exact release setup.ps1 cd/call and flags; only /log is appended. No breakaway or direct msiexec.
          $command = "cd $pythonArchPath && call $exeName $execParams /quiet /log `"$logPath`""
          Write-Output ('Diagnostic command: cmd.exe /c ' + $command)
          $cmd = Join-Path ([Environment]::SystemDirectory) 'cmd.exe'
          $LASTEXITCODE = $null
          $ErrorActionPreference = 'Continue'
          & $cmd /c $command 2>&1 | ForEach-Object { Write-Output $_.ToString() }
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($null -eq $exitCode) {
              Write-Output 'Diagnostic cmd exit code unavailable: native invocation did not report a code'
          } else {
              $signed = [int]$exitCode
              $hex = [BitConverter]::ToUInt32([BitConverter]::GetBytes($signed), 0).ToString('X8')
              Write-Output ('DIAGNOSTIC_INSTALLER_EXIT decimal=' + $signed + ' hex=0x' + $hex)
          }
          $files = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File -Filter 'python-installer-diagnostic*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 8)
          $total = 0
          Write-Output ('Explicit-prefix installer logs: ' + $files.Count)
          foreach ($file in $files) {
              if ($file.Length -gt 262144 -or ($total + $file.Length) -gt 1048576) {
                  Write-Output ('Skipped oversized installer log: ' + $file.Name + '; bytes=' + $file.Length)
                  continue
              }
              $total += $file.Length
              $text = [IO.File]::ReadAllText($file.FullName)
              $text = $text -replace '(?im)^.*(?:token|password|authorization|secret|cookie).*$', '[REDACTED credential-related line]'
              $text = $text -replace '(https?://[^\s?]+)\?[^\s]+', '$1?[QUERY REDACTED]'
              $text = $text -replace '(?:github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]+)', '[REDACTED token]'
              Write-Output ('Installer log: ' + $file.FullName + '; original bytes=' + $file.Length)
              $lines = $text -split '\r?\n'
              $matchedLines = @()
              for ($index = 0; $index -lt $lines.Length; $index++) {
                  if ($lines[$index] -match '(?i)error|failed|exit code|return code|result:|0x[0-9a-f]{8}') {
                      $matchedLines += $index
                      if ($matchedLines.Count -ge 40) { break }
                  }
              }
              Write-Output '--- Installer error/code excerpts ---'
              foreach ($index in $matchedLines) {
                  $start = [Math]::Max(0, $index - 1)
                  $end = [Math]::Min($lines.Length - 1, $index + 1)
                  for ($line = $start; $line -le $end; $line++) {
                      Write-Output (($line + 1).ToString() + ': ' + $lines[$line])
                  }
              }
              Write-Output ('BEGIN_SANITIZED_PYTHON_INSTALLER_LOG ' + $file.Name)
              Write-Output $text
              Write-Output ('END_SANITIZED_PYTHON_INSTALLER_LOG ' + $file.Name)
          }
          Write-Output ('=== Diagnostic retry/log collection complete; bytes=' + $total + '; not a workflow pass ===')
          exit 0
